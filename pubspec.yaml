name: laza_shop_firebase_app
description: "A production-ready Flutter e-commerce application (Laza Shop)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_bloc: ^8.1.6
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  equatable: ^2.0.5
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  device_info_plus: ^13.3.0
  image_picker: ^1.2.4
  google_maps_flutter: ^2.18.2
  local_auth: 2.2.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  local_auth_android: 1.0.56

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
